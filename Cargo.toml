[package]
name = "mqtt-log"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytesize = { version = "2.7", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
humantime-serde = "1"
rolling-file = "0.2"
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
    "fs",
    "io-util",
] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
